  <!-- Slick CSS -->

    rel="stylesheet"

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      text-align: center;
      margin: 0;
      padding: 60px 0;
      overflow-x: hidden;
      background: #111;
      color: #fff;
      font-family: Helvetica, sans-serif;
    }

    .slider-wrapper {
      width: 100%;
      overflow: hidden;
    }

    .center-slider {
      margin: 0 auto;
    }

    .slide {
      padding: 20px 10px;
    }

    .slide-inner {
      min-height: 360px;
      display: grid;
      place-items: center;
      transition:
        transform 300ms ease,
        opacity 300ms ease;
    }
    .slide-inner img {
      width: 100%;
    }
    .slide-inner p {
      margin-top:1.2rem;
    }
    /* Dim and shrink inactive slides */
    .slick-slide .slide-inner {
      opacity: 0.45;
      transform: scale(0.88);
          display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    }

    /* Highlight the centered slide */
    .slick-center .slide-inner {
      opacity: 1;
      transform: scale(1);
    }

    /* Give arrows a little breathing room */
    .slick-prev {
      left: 25px;
      z-index: 2;
    }

    .slick-next {
      right: 25px;
      z-index: 2;
    }

    .slick-prev::before,
    .slick-next::before {
      font-size: 32px;
    }

    .slick-dots {
      bottom: -35px;
    }

    .slick-dots li button::before {
      color: #fff !important;
    }
    button {
      border: none;
      padding:0;
    }
    @media (max-width: 767px) {
      body {
        padding-top: 30px;
      }

      .slide-inner {
        min-height: 280px;
        font-size: 2rem;
      }

      .slick-prev {
        left: 10px;
      }

      .slick-next {
        right: 10px;
      }

    }

    .image-button {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: zoom-in;
}

.slide-inner img {
  display: block;
  width: 100%;
  height: 100%;
  max-height: 500px;
  object-fit: cover;
}

.image-modal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  padding: 40px;
  background: rgba(0, 0, 0, 0.9);
}

.image-modal[hidden] {
  display: none;
}

.modal-image {
  display: block;
  max-width: min(1200px, 95vw);
  max-height: 90vh;
  object-fit: contain;
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
}

.modal-close {
  position: fixed;
  top: 20px;
  right: 25px;
  z-index: 10000;
  padding: 5px 12px;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 48px;
  line-height: 1;
  cursor: pointer;
}

body.modal-open {
  overflow: hidden;
}

.slick-dots li {
  width:auto;
}

.slick-dots li button {
      width: 3vw;
  }

  </style>


</head>

  <!-- Slick JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>

  <script>
    $(function () {
      $(".center-slider").slick({
        centerMode: true,
        centerPadding: "120px",
        slidesToShow: 3,
        slidesToScroll: 1,

        infinite: true,
        arrows: true,
        dots: true,
        speed: 500,
        focusOnSelect: true,

        responsive: [
          {
            breakpoint: 1024,
            settings: {
              slidesToShow: 3,
              centerPadding: "60px"
            }
          },
          {
            breakpoint: 768,
            settings: {
              slidesToShow: 1,
              centerPadding: "70px"
            }
          },
          {
            breakpoint: 480,
            settings: {
              slidesToShow: 1,
              centerPadding: "35px"
            }
          }
        ]
      });
    });

    const modal = document.querySelector("#imageModal");
const modalImage = modal.querySelector(".modal-image");
const closeButton = modal.querySelector(".modal-close");

function openModal(image) {
  modalImage.src = image.currentSrc || image.src;
  modalImage.alt = image.alt;

  modal.hidden = false;
  document.body.classList.add("modal-open");

  closeButton.focus();
}

function closeModal() {
  modal.hidden = true;
  modalImage.src = "";

  document.body.classList.remove("modal-open");
}

document.addEventListener("click", function (event) {
  const imageButton = event.target.closest(".image-button");

  if (imageButton) {
    const image = imageButton.querySelector("img");

    if (image) {
      openModal(image);
    }

    return;
  }

  if (event.target === modal || event.target === closeButton) {
    closeModal();
  }
});

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape" && !modal.hidden) {
    closeModal();
  }
});
  </script>
